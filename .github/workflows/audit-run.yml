name: audit-run
on:
  push:
    branches: [audit-run]
    paths: [requests.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          curl -sS -m 60 -X POST https://expert-360.ca/api/comprendre -H 'Content-Type: application/json' -H 'Origin: https://expert-360.ca' -d '{"url":"dronenetwork.ca"}' -o out/comprendre.json -w "comprendre %{http_code} %{time_total}s\n" | tee out/codes.txt || true
          curl -sS -m 20 https://expert-360.ca/audit.js -o out/audit.js -w "auditjs %{http_code}\n" | tee -a out/codes.txt || true
      - run: |
          git config user.name audit-bot && git config user.email audit-bot@users.noreply.github.com
          git add out && git commit -m "résultats [skip ci]" && git push
