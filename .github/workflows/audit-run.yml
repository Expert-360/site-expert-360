name: audit-run
on:
  push:
    branches: [audit-run]
    paths: [requests.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          curl -sS https://expert-360.ca/audit-google-ads | grep -o 'audit.js?v=[0-9]*' > out/codes.txt || true
          curl -sSI https://expert-360.ca/audit-google-ads | grep -i 'date\|age\|x-nf' >> out/codes.txt || true
          curl -sS -m 60 -X POST https://expert-360.ca/api/analyse -H 'Content-Type: application/json' -d '{"url":"dronenetwork.ca","metier":"pilote de drone","zone":"canada"}' | jq -c '{zone, vol:.apercu.recherchesMois, reg:[.regions[]?.ville]}' >> out/codes.txt || true
      - run: |
          git config user.name audit-bot && git config user.email audit-bot@users.noreply.github.com
          git add out && git commit -m "résultats [skip ci]" && git push
