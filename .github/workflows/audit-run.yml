name: audit-run
on:
  push:
    branches: [audit-run]
    paths: [requests.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          curl -sS -o /dev/null -w "page %{http_code}\n" https://expert-360.ca/audit-google-ads > out/codes.txt || true
          curl -sS https://expert-360.ca/audit-google-ads | grep -o 'audit.js?v=[0-9]*\|Site not available\|paused' | head -3 >> out/codes.txt || true
          curl -sS -m 60 -X POST https://expert-360.ca/api/analyse -H 'Content-Type: application/json' -d '{"url":"genisol.ca"}' -w "\nanalyse %{http_code}\n" | tail -c 300 >> out/codes.txt || true
      - run: |
          git config user.name audit-bot && git config user.email audit-bot@users.noreply.github.com
          git add out && git commit -m "résultats [skip ci]" && git push
